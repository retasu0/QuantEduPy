[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finsimlab"
version = "0.1.0"
description = "Educational financial engineering simulations for Python beginners."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "FinSimLab contributors" }
]
keywords = [
  "finance",
  "financial-engineering",
  "simulation",
  "monte-carlo",
  "education"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
  "Topic :: Office/Business :: Financial"
]
dependencies = [
  "numpy>=1.26",
  "matplotlib>=3.8"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]
notebook = [
  "jupyter>=1.0",
  "ipywidgets>=8.0"
]
education = [
  "openai>=2.0"
]

[project.urls]
Homepage = "https://github.com/your-name/finsimlab"
Repository = "https://github.com/your-name/finsimlab"
Issues = "https://github.com/your-name/finsimlab/issues"

[tool.setuptools.packages.find]
include = ["finsimlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"
